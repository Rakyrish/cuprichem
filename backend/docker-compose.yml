# Local/staging stack for the Cuprichem control centre.
#
#   docker compose up -d db redis      # dependencies only, run Django on the host
#   docker compose up -d               # the whole stack
#
# Secrets come from backend/.env — nothing sensitive is written into this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuprichem}
      POSTGRES_USER: ${POSTGRES_USER:-cuprichem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuprichem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mediafiles:/app/mediafiles

  worker:
    build: .
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # Concurrency is low on purpose: these workers call a paid API.
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - mediafiles:/app/mediafiles

volumes:
  pgdata:
  redisdata:
  mediafiles:
