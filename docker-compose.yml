# Production stack: Next.js standalone app behind Caddy (auto-HTTPS + headers).
#
# Every value comes from the single repository-root `.env` — Compose reads it
# for `${...}` interpolation, passes it to both containers via `env_file`, and
# mounts it into the build as a secret so the browser-visible values can be
# inlined without ever landing in an image layer.
#
#   cp .env.example .env      # fill in, then:
#   docker compose up -d --build
#
# Caddy needs ports 80/443 to obtain certificates.

services:
  web:
    build:
      context: .
      args:
        WEB_PORT: ${WEB_PORT}
      secrets:
        - dotenv
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT}
    expose:
      - "${WEB_PORT}"
    # No published ports — only Caddy talks to it.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  dotenv:
    file: ./.env

volumes:
  caddy_data:
  caddy_config:
